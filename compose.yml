name: ro6one-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ro6one-web:latest
    restart: unless-stopped

    # Correct signal handling and zombie reaping for PID 1.
    init: true

    environment:
      NODE_ENV: production
      # adapter-node listens here inside the container.
      HOST: 0.0.0.0
      PORT: '3000'
      # Public origin, used for absolute URLs. Must match the domain the
      # reverse proxy serves, or SvelteKit will build wrong URLs.
      ORIGIN: ${ORIGIN:-https://ro6one.com}
      # Trust the proxy's forwarding headers for scheme/host.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Used for canonical + Open Graph URLs (see src/lib/components/ui/Seo.svelte).
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ro6one.com}

    # Published on localhost by default: TLS and public exposure belong to the
    # reverse proxy in front of this container, not to the app.
    ports:
      - '${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000'

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
